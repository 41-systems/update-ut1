name: Update UT1 redirector list
on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch list
        run: |
          curl -fsSL https://dsi.ut-capitole.fr/blacklists/download/redirector.tar.gz -o r.tar.gz
          tar -xzf r.tar.gz
          cp redirector/domains ut1-redirector.txt
          rm -rf r.tar.gz redirector
      - name: Commit if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add ut1-redirector.txt
          git diff --staged --quiet || (git commit -m "Update UT1 redirector list" && git push)
